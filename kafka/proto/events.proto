syntax = "proto3";

package kafka.onchain.v1;

option java_package = "io.kafka.onchain.v1";
option go_package = "github.com/kafka/onchain/v1";

// OnChainEvent represents a single on-chain transaction event.
// Partition key: from_address — guarantees ordering per sender.
// All fields are required unless marked optional in v2+.
message OnChainEvent {
    string tx_hash = 1;
    string from_address = 2;
    string to_address = 3;
    double amount = 4;
    int64 timestamp = 5;
    string chain_id = 6;
}
