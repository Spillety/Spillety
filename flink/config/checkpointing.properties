checkpoint.interval.ms=60000
checkpoint.mode=EXACTLY_ONCE
checkpoint.timeout.ms=300000
checkpoint.min.pause.ms=30000
checkpoint.max.concurrent=1
checkpoint.fail.on.errors=true
checkpoint.externalized.retention=RETAIN_ON_CANCELLATION
state.backend=rocksdb
state.checkpoints.dir=s3://flink-checkpoints/
state.backend.rocksdb.ttl.hawkes.days=14
state.backend.rocksdb.ttl.pagerank.days=30
state.backend.rocksdb.incremental=true
