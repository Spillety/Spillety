apiVersion: apps/v1
kind: Deployment
metadata:
  name: memgraph-single-node
  labels:
    app: memgraph
spec:
  replicas: 1  # MVP: single node, no replication
  selector:
    matchLabels:
      app: memgraph
  template:
    metadata:
      labels:
        app: memgraph
    spec:
      containers:
        - name: memgraph
          image: memgraph/memgraph:latest
          resources:
            requests:
              memory: "256Gi"
              cpu: "8"
            limits:
              memory: "256Gi"
              cpu: "8"
          ports:
            - containerPort: 7687
              name: bolt
            - containerPort: 3000
              name: management
          env:
            - name: MEMGRAPH_RAM_LIMIT
              value: "268435456"
            - name: MEMGRAPH_WAL_ENABLED
              value: "true"
      # # ponytail: Memgraph replication, add when single node fails > 2 times
      # Add StatefulSet + replication via memgraph-platform upon failure > 2
