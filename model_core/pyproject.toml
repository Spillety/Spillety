[project]
name = "model_core"
version = "1.0.0"
description = "K-BRAIN Model Core: Causal Attention, Hyperbolic MP, Training Pipeline"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2.0",
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "pandas>=2.1",
    "pyyaml>=6.0",
    "redis>=5.0",
    "hnswlib>=0.8",
    "networkx>=3.2",
    "transformers>=4.40",
    "accelerate>=0.30",
    "torchmetrics>=1.2",
    "jsonschema>=4.20",
    "pyarrow>=10.0",
    "pyiceberg>=0.6",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]
fsdp = [
    "torch>=2.2.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "."}
packages = {find = {where = ["."]}}

[tool.setuptools.dynamic]
readme = {file = []}
