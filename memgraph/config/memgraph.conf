# Memgraph configuration for 256GB single-node MVP

[storage]
mode = in_memory

[experimental]
enable_vector_index = true
enable_hnsw_index = true

[memory]
limit = 268435456

[replication]
enabled = false
# # ponytail: Memgraph replication, add when single node fails > 2 times
# Replication disabled for MVP — enabled upon failure threshold
