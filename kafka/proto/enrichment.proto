syntax = "proto3";

package kafka.enrichment.v1;

option java_package = "io.kafka.enrichment.v1";
option go_package = "github.com/kafka/enrichment/v1";

// NewsArticleEvent: single news-feed item mentioning wallets or persons.
// Maps to ontology node NewsArticle, edge MENTIONED_IN (wave C writer).
// Partition key: article_url — guarantees ordering per article.
message NewsArticleEvent {
    string event_id = 1;
    string article_url = 2;
    string title = 3;
    repeated string mentioned_addresses = 4;
    string lang = 5;
    int64 event_time_ms = 6;
}

// KycUpdate: profile change for a Person linked to wallets.
// Maps to ontology node Person, edge SAME_AS (wallet linkage, wave C).
// Partition key: person_id — guarantees ordering per person.
message KycUpdate {
    string event_id = 1;
    string person_id = 2;
    repeated string wallet_addresses = 3;
    string status = 4;
    int64 event_time_ms = 5;
}

// AvmScreening: address screening verdict from AVM provider.
// Attaches to Wallet/Exchange/Mixer node as screening property.
// Partition key: address — guarantees ordering per address.
message AvmScreening {
    string event_id = 1;
    string address = 2;
    string verdict = 3;
    double score = 4;
    string screener_id = 5;
    int64 event_time_ms = 6;
}
