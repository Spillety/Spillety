    precision_min: 0.95
    recall_min: 0.80

  over_merging:
    cluster_size_max: 1000

  heuristics:
    timing_window_sec: 3600
    fee_tolerance: 0.05

  human_in_the_loop:
    confidence_threshold: 0.7

  priority:
    p0:
      confidence_max: 0.3
      cluster_size_min: 50
    p1:
      confidence_max: 0.7
    p2:
      confidence_min: 0.7
      confidence_max: 0.8
