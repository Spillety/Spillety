model:
  num_classes: 6
  embedding_dim: 128
  causal_depth: 2
  hyperbolic_dim: 128

loss:
  alpha: 1.0
  beta_init: 0.1
  beta_final: 0.5
  annealing_epochs: 50
  focal_gamma: 2.0
  contrastive_tau: 0.1

fsdp:
  sharding_strategy: SHARD_GRAD_OP
  backend: nccl
  cpu_offloading: false

training:
  epochs: 100
  batch_size: 64
  lr: 1e-4
  optimizer: adamw
  warmup_epochs: 5

hawkes:
  power_law_alpha_init: 0.5
  ttl_days: 14
  fourier_components:
    hourly: 4
    daily: 2
  learning_rate: 0.01

inference:
  bfs_depth: 2
  micro_batch_min: 32
  micro_batch_max: 64
  lru_cache_capacity: 10000
  lru_cache_ttl_hours: 1
  latency_budget_extraction_ms: 20
  latency_budget_forward_ms: 60
  latency_budget_explanation_ms: 20

explainability:
  influence_steps: 100
  top_k_paths: 3
  hnsw_ef_construction: 200
  hnsw_m: 32
  hnsw_ef_search: 200
  lora_rank: 8
  temperature: 0.0