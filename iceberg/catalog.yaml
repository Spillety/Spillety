# Iceberg catalog config (G6.2).
# S3/REST catalog is enabled via env override in catalog.py.
catalog:
  type: sql
  uri: "sqlite:////tmp/kbrain_iceberg_catalog.db"
  warehouse: "file:///tmp/kbrain_iceberg_warehouse"
table:
  namespace: "aml"
  name: "alerts"
partition:
  field: "event_date"
  transform: "day"
