pipeline:
  name: entity-resolution
  version: "1.0"

  kafka:
    bootstrap_servers: "kafka:9092"
    topic_co_spend: "co-spend-events"
    topic_evm: "evm-events"
    group_id: "entity-resolution"

  memgraph:
    host: "memgraph:7687"
    database: "entity_resolution"

  mlflow:
    tracking_uri: "http://mlflow:5000"
    model_registry: "entity-resolution-models"

  scheduling:
    heuristic: "incremental"
    ml_batch: "0 2 * * *"  # nightly at 02:00 UTC
    anomaly_check: "on_merge"

  merge:
    heuristic_weight: 0.4
    ml_weight: 0.6
    confidence_threshold: 0.7

  exchange:
    coverage_threshold: 0.95
    source_labels: ["elliptic++", "internal_labeled"]
